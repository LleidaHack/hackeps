  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Space Mono is self-hosted (see /style.css). Preloading the two subsets the
         first paint needs removes the CSS→font request chain. -->
  <link rel="preload" href="/fonts/space-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/space-mono-latin-700.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Font Awesome is only used by the full site, never by the waiting page:
         load it without blocking the first render. -->

    integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />
  <meta name="theme-color" content="#000000" />
  <link href="/style.css" rel="stylesheet" />
  <meta name="description"
    content="Lleidahack et dóna la benvinguda a la HackEPS 2026, la primera hackató de les terres de Lleida!" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logoHackeps2026.png" />
  <meta property="og:title" content="HackEPS 2026" />
  <meta property="og:image" content="%PUBLIC_URL%/logoHackeps2026.png" />
  <meta property="og:description"
    content="Lleidahack et dóna la benvinguda a la HackEPS 2026, la primera hackató de les terres de Lleida!" />
  <meta property="og:url" content="%PUBLIC_URL%" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will.
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>HackEPS 2026</title>
</head>
