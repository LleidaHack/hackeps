# Keep legacy public hosts as redirects when they still reach this server.
server {
    listen 80;
    server_name lleidahack.dev www.lleidahack.dev www.hackeps.dev;
    return 308 https://hackeps.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Preserve old links and query parameters without exposing a duplicate URL.
    rewrite ^/hackeps/?$ / permanent;
    rewrite ^/hackeps/(.*)$ /$1 permanent;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets with caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted fonts (already woff2-compressed, so no gzip)
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
    
    # Security headers (keep in sync with vercel.json, which production uses)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.lleidahack.dev https://va.vercel-scripts.com https://vitals.vercel-insights.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}