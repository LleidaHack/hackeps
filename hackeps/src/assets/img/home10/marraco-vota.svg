  <path fill="#38b59d" stroke="#1f7f6c" stroke-width="3" d="M70 70 L58 40 L86 58 Z"/>
  <path fill="#38b59d" stroke="#1f7f6c" stroke-width="3" d="M170 70 L182 40 L154 58 Z"/>
