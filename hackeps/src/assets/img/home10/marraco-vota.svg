  <g transform="rotate(10 138 146)">
    <rect x="124" y="124" width="28" height="36" rx="3" fill="#ffffff" stroke="#2e2e2f" stroke-width="4"/>
    <path fill="none" stroke="#ee7438" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M130 140 L136 146 L146 132"/>
  </g>
  <!-- Claw holding the ballot -->
  <path fill="#e5161f" stroke="#2e2e2f" stroke-width="3" d="M150 152 C150 136 168 134 172 146 L172 158 L150 158 Z"/>
  <path fill="#fbe345" d="M156 140 L160 127 L164 140 Z"/>
  <path fill="#fbe345" d="M164 143 L170 132 L171 146 Z"/>
