  <ellipse cx="98" cy="86" rx="14" ry="12" fill="#fbe345" stroke="#e5161f" stroke-width="3"/>
  <ellipse cx="142" cy="86" rx="14" ry="12" fill="#fbe345" stroke="#e5161f" stroke-width="3"/>
  <rect x="96" y="76" width="4" height="20" rx="2" fill="#1f7f6c"/>
  <rect x="140" y="76" width="4" height="20" rx="2" fill="#1f7f6c"/>
  <!-- Snout -->
  <path fill="#e5161f" d="M92 122 C92 108 108 104 112 116 C112 122 106 124 102 120 C100 126 92 128 92 122 Z"/>
  <path fill="#e5161f" d="M148 122 C148 108 132 104 128 116 C128 122 134 124 138 120 C140 126 148 128 148 122 Z"/>
  <path fill="none" stroke="#1f7f6c" stroke-width="3" stroke-linecap="round" d="M106 104 Q120 98 134 104"/>
  <!-- Fangs -->
  <path fill="#fbe345" stroke="#e5161f" stroke-width="2" d="M96 150 L102 170 L108 150 Z"/>
  <path fill="#fbe345" stroke="#e5161f" stroke-width="2" d="M132 150 L138 170 L144 150 Z"/>
  <!-- Ballot box -->
  <rect x="40" y="150" width="160" height="78" rx="8" fill="#ffffff" stroke="#2e2e2f" stroke-width="5"/>
  <rect x="40" y="150" width="160" height="18" rx="6" fill="#dfe6f3" stroke="#2e2e2f" stroke-width="5"/>
  <rect x="92" y="155" width="56" height="8" rx="4" fill="#2e2e2f"/>
  <text x="120" y="208" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#2e2e2f">29N</text>
